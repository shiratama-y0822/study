<!DOCTYPE html>

<html>

<head>
    <title>Pokemon Manager</title>
</head>

<body>
    <h1>Pokemon Manager</h1>
    <p>Pokemonを<span>検索・管理</span>するApplicationです。</p>
    <div>
        <h2>おすすめPokemon</h2>
        <img src="pikachu.png" alt="Pikachu">
        <p>Name: <span>Pikachu</span></p>
        <p>Type: <span>Electric</span></p>
        <a href="https://zukan.pokemon.co.jp/detail/0025">詳しく見る</a>
    </div>
    <div>
        <h2>Pokemon List</h2>
        <ul>
            <li>Pikachu</li>
            <li>Bulbasaur</li>
            <li>Squirtle</li>
        </ul>
    </div>
    <div>
        <h2>Pokemon Search</h2>
        <form>
            <input type="text" placeholder="Pokemon Name">
            <button type="submit">検索</button>
        </form>
    </div>
</body>

</html>
